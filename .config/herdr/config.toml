onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[remote]
manage_ssh_config = true

[keys]
prefix = "ctrl+h"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "ctrl+["
previous_tab = "ctrl+]"
switch_tab = "prefix+1..9"
rename_tab = "prefix+n"
close_tab = "prefix+x"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+-"
split_vertical = "prefix+|"
cycle_pane_next = "ctrl+o"
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+n"

[theme]
name = "tokyo-night"
auto_switch = false

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "hunk diff"
description = "Launch Hunk git diff TUI in a floating popup window"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+l"
command = "glogs"
type = "popup"
description = "Launch glogs TUI in a floating popup window"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+z"
type = "popup"
command = "zsh"
description = "Launch a zsh shell in a floating popup window"
width = "85%"
height = "85%"
