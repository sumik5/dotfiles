
[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[remote]
manage_ssh_config = true

[keys]
prefix = "ctrl+h"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "ctrl+["
previous_tab = "ctrl+]"
switch_tab = "prefix+1..9"
rename_tab = "prefix+n"
close_tab = "prefix+x"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+-"
split_vertical = "prefix+|"
cycle_pane_next = "ctrl+o"

[theme]
name = "tokyo-night"
auto_switch = false

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true
