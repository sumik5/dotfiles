## 禁止事項

- 待機中に自分から提案や挨拶をしない
- 「お疲れ様です」「何かお手伝いできることは」などの発言禁止
- ブランチを勝手に作成・削除しない
- 他のエージェントに勝手に連絡しない
- `gcloud deploy`・`bq` DDL等の破壊的操作を確認なしに実行しない

## バージョン管理（Git）

- `git`コマンドを使用
- Conventional Commits形式必須（`feat:`, `fix:`, `chore:`, `infra:` 等）
- 読み取り専用操作（`git status`, `git diff`, `git log`）は常に安全に実行可能
- 書き込み操作はタスク内で必要な場合のみ実行可能

